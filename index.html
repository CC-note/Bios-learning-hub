<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIOS PM 0→1 Learning Hub</title><style>
:root{--bg:#f7f8fb;--card:#fff;--ink:#111827;--muted:#667085;--line:#e5e7eb;--p:#4f46e5;--p2:#7c3aed;--soft:#f3f2ff;--amber:#d97706;--green:#16a34a;--shadow:0 12px 32px #1e293b12}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fbfcff,var(--bg));font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink)}header{height:70px;display:flex;align-items:center;gap:14px;padding:0 22px;background:#fffffff2;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.brand{font-weight:900;font-size:20px;border:0;background:none}.brand span{color:var(--p)}.ver{margin-left:auto;font-size:12px;color:var(--muted);padding:5px 9px;border:1px solid var(--line);border-radius:999px}.shell{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 70px)}aside{padding:18px 14px;border-right:1px solid var(--line);background:#ffffffb8;position:sticky;top:70px;height:calc(100vh - 70px);overflow:auto}.navt{font-size:11px;font-weight:900;letter-spacing:.09em;color:var(--muted);margin:12px 10px 6px;text-transform:uppercase}aside button{width:100%;border:0;background:none;color:var(--muted);text-align:left;padding:11px 12px;border-radius:12px;cursor:pointer;margin:2px 0}aside button:hover,aside button.on{background:var(--soft);color:var(--p);font-weight:800}main{padding:34px 38px 70px;max-width:1400px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow)}.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}.hero .card:first-child{background:linear-gradient(135deg,#4f46e519,#7c3aed0e),white;padding:34px}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--p);text-transform:uppercase}h1{font-size:44px;line-height:1.08;margin:10px 0 14px}h2{font-size:24px;margin:0 0 12px}h3{margin:0 0 9px}.muted{color:var(--muted);line-height:1.7}.btn{border:0;border-radius:13px;padding:11px 15px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:800;cursor:pointer}.metrics,.layers,.mods,.levels,.assets{display:grid;gap:14px}.metrics{grid-template-columns:1fr 1fr}.metric{padding:15px;border:1px solid var(--line);border-radius:15px}.metric b{font-size:25px;display:block}.metric span{font-size:12px;color:var(--muted)}.layers{grid-template-columns:1fr 1fr}.mods{grid-template-columns:repeat(3,1fr)}.levels{grid-template-columns:repeat(4,1fr)}.assets{grid-template-columns:1fr 1fr}.layer,.mod{cursor:pointer;transition:.16s}.layer:hover,.mod:hover{transform:translateY(-2px);border-color:#c9c7ff}.num{color:var(--p);font-size:12px;font-weight:900}.pill{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:4px 8px;margin:3px 3px 0 0}.internal{color:#b45309;border-color:#fed7aa;background:#fff7ed}.progress{color:#92400e;border-color:#fde68a;background:#fffbeb}.section{margin-top:28px}.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.node{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:800}.arrow{color:var(--muted)}.note{border-left:4px solid var(--amber);background:#fff7ed;color:#7c2d12;border-radius:9px;padding:12px 14px;margin-top:18px}.lesson{display:grid;grid-template-columns:1.08fr .92fr;gap:18px}.callout{background:#f7f6ff;border:1px solid #dcdcff;border-radius:14px;padding:14px;margin:14px 0}.quiz button{display:block;width:100%;text-align:left;margin:7px 0;padding:10px 12px;border:1px solid var(--line);background:#fff;border-radius:11px}.ok{background:#f0fdf4!important;border-color:#86efac!important}.no{background:#fef2f2!important;border-color:#fca5a5!important}.asset{min-height:155px}.assetIcon{font-size:34px;width:62px;height:62px;border-radius:16px;background:#f0efff;display:grid;place-items:center;margin-bottom:13px}@media(max-width:900px){.shell{grid-template-columns:1fr}aside{position:static;height:auto;display:flex;overflow:auto}aside .navt{display:none}aside button{width:auto;white-space:nowrap}.hero,.lesson{grid-template-columns:1fr}.layers,.assets{grid-template-columns:1fr}.mods{grid-template-columns:1fr 1fr}.levels{grid-template-columns:1fr 1fr}main{padding:24px}}@media(max-width:600px){h1{font-size:34px}.mods,.metrics,.levels{grid-template-columns:1fr}main{padding:18px}}
</style></head><body><header><button class="brand" onclick="home()">BIOS PM <span>0→1</span></button><span class="ver">Management Review v10</span></header><div class="shell"><aside><div class="navt">Learning Hub</div><button id="n-home" class="on" onclick="home()">🏠 Learning Dashboard</button><button id="n-map" onclick="map()">🧭 PM Learning Map</button><button id="n-assets" onclick="assetPage()">🖼 Diagram Library</button><div class="navt">Knowledge Layers</div><button id="n-common" onclick="layer('common')">01 Common Technical Knowledge</button><button id="n-insyde" onclick="layer('insyde')">02 Insyde Know-how</button><button id="n-pm" onclick="layer('pm')">03 PM Professional Competency</button><button id="n-daily" onclick="layer('daily')">04 PM Daily Practice</button><div class="navt">Assessment</div><button id="n-assess" onclick="assessment()">✓ Competency Assessment</button></aside><main id="app"></main></div><script>
const L={common:{n:'01',t:'Common Technical Knowledge',s:'建立 BIOS PM 必須具備的產業共通知識。Generic first、Normal flow first。',i:0,m:[['pc','PC / Notebook 與 BIOS 基本架構','CPU、RAM、SPI Flash、Storage、PCH/SoC、EC 的責任邊界。','In Progress'],['uefi','BIOS / UEFI Fundamentals','Firmware、POST、Setup 與 BIOS/UEFI 的基本定位。','In Progress'],['boot','Boot Flow：Power On → OS','SEC → PEI → DXE → BDS → OS 的完整故事。','In Progress'],['enum','Device Initialization & Enumeration','PCIe / NVMe / USB / Display / Storage 如何被看到。','Planned'],['power','Power Management & ACPI','ACPI、S0ix、Modern Standby、S3/S4/S5。','Planned'],['security','Platform Security','Secure Boot、TPM、BitLocker、Firmware Authentication。','Planned']]},insyde:{n:'02',t:'Insyde Know-how',s:'整理只有在 Insyde 工作才會知道的流程、工具、責任邊界與工作方法。',i:1,m:[['workflow','CRB Validation → Project Board Flow','以 CRB/RVP 當 baseline，透過 compare 縮小範圍並定位 owner。','In Progress'],['kernel','Kernel / BSP / Codebase','Kernel、BSP、Project code 與版本關係。','Planned'],['tool','H2O Toolchain','H2OIDE / H2OEZE / H2OFFT 的用途與 PM 邊界。','Planned'],['boundary','Feature / Chipset / Project Responsibility','遇到不同類型 issue，PM 該找哪個 owner。','Planned'],['its','ITS Handling Workflow','Symptom / Steps / Version / Result / Owner / Target / Closure。','Planned'],['case','Real Issue Case Study Library','把真實 issue 去敏後轉成 Case Study。','Planned']]},pm:{n:'03',t:'PM Professional Competency',s:'BIOS PM 不只是轉寄資訊，而是把需求、風險與未知整理成可執行決策。',i:0,m:[['role','BIOS PM Role & Responsibility','角色定位、ownership、decision boundary、escalation。','In Progress'],['biz','Business ↔ PM Collaboration','Requirement → Scope → Resource → Schedule → Risk → Commitment。','Planned'],['rd','RD ↔ PM Collaboration','Symptom → Reproduce → Baseline → Scope → Owner → Target → Verification。','Planned'],['cust','Customer ↔ PM Collaboration','Expectation → Clarification → Status → Risk → Next Action。','Planned'],['scope','Requirement / Scope / Priority','需求釐清、acceptance criteria、scope change、priority。','Planned'],['risk','Risk / Dependency / Escalation','辨識 blocker、dependency 與 escalation timing。','Planned']]},daily:{n:'04',t:'PM Daily Practice',s:'把「新人每天到底要做什麼」變成可操作、可練習、可驗收的工作模組。',i:0,m:[['mail','Daily Mail & To-do Management','把信件轉成 Action / Owner / Due / Follow-up。','Planned'],['itsdaily','ITS Daily Tracking','Open issue、aging、owner、target、blocker。','Planned'],['weekly','Weekly Report & Management Summary','Status、risk、next step、management view。','Planned'],['version','BIOS Version / Tag / Branch Tracking','版本、tag、branch、release mapping。','Planned'],['mom','Meeting / MoM / Action Item','會前準備、MoM、owner/due、follow-up。','Planned'],['release','Release Readiness & Milestone Check','Milestone、QA、known issue、release criteria。','Planned']]}};
const lesson={role:{t:'BIOS PM Role & Responsibility',o:'新人能說明 BIOS PM 的核心價值與責任邊界。',one:'BIOS PM 的價值，是把複雜資訊整理成「誰要做什麼、何時完成、怎麼驗證」。',f:['Input','Clarify','Scope','Owner','Track','Verify','Communicate'],b:['對外：把 technical status 轉成 Customer 可理解、可追蹤的更新。','對內：把 Requirement / Issue 整理成 RD 可分析的資訊，而不是只轉寄 Mail。','對專案：管理 schedule、dependency、risk、milestone 與 release readiness。'],q:['收到一封模糊 issue mail，第一步？',['直接轉 RD','先釐清 Symptom / Version / Reproduce / Impact','直接承諾日期'],1]},biz:{t:'Business ↔ PM Collaboration',o:'把商務需求轉成可評估的 technical scope 與 commitment。',one:'Business 告訴你「客戶想要什麼」；PM 要回答「實際要做什麼、誰做、何時能交」。',f:['Requirement','Scope','Resource','Schedule','Risk','Commitment'],b:['確認需求目的與 acceptance criteria。','辨識 Feature / NRE / Consult / Existing capability。','確認 dependency：Chipset、Feature、Project、QA、Customer input。'],q:['Business 問「下週能不能交？」最先確認？',['先答可以','Scope / owner / dependency / validation','先請客戶等'],1]},rd:{t:'RD ↔ PM Collaboration',o:'新人能用完整資訊與 RD 合作，持續把未知範圍縮小。',one:'PM 不一定修 code，但要讓 RD 能有效開始分析，並確保分析有下一步。',f:['Symptom','Reproduce','Version','Baseline','Scope','Owner','Target','Verification'],b:['Issue 描述至少有 Symptom / Steps / Version / Result。','先做 baseline：舊版、CRB/RVP、Reference BIOS、其他平台。','PM 要追 next action，不只問「有沒有進度」。'],q:['RD 說「無法重現」，最有效下一步？',['催快一點','補環境、版本、steps、log 與 pass/fail baseline','直接換 owner'],1]},cust:{t:'Customer ↔ PM Collaboration',o:'新人能提供透明但不 over-commit 的客戶溝通。',one:'客戶需要的不只是「還在查」，而是：知道什麼、不知道什麼、下一步是什麼。',f:['Expectation','Clarify','Status','Risk','Next Action','Target'],b:['確認 customer impact 與 urgency。','區分 Evidence / Hypothesis / Confirmed Root Cause。','每次 update 包含 next action / owner / expected checkpoint。'],q:['Root cause 未確認、客戶每天追，最佳 update？',['Still checking','Evidence + 驗證項目 + next action/checkpoint','直接寫最可能 root cause'],1]},workflow:{t:'CRB Validation → Project Board Flow',o:'理解 IBV 為什麼用 CRB/RVP 建立 baseline，並透過 comparison 縮小 issue 範圍。',one:'CRB/RVP 是 Control Group；目的不是證明「不是 BIOS 問題」，而是建立基準、找 Delta、定位真正 owner。',f:['Issue Report','CRB/RVP Verify','Project Board Compare','Find Delta','Identify Owner','Fix & Validate'],b:['CRB/RVP 較少客製化，適合作為 controlled baseline。','比較 BIOS / ACPI / PCD / EC / FW / Device / Board Design 等 Delta。','Project Board 更接近 OEM/ODM 實際產品情境。'],q:['使用 CRB/RVP 的主要目的？',['證明一定不是 BIOS 問題','建立 baseline、縮小範圍、找 Delta','取代 Project Board 驗證'],1]}};
const assets=[['🖥️','PC / Notebook Reference Platform (公版)','Common Technical Knowledge','PC / Notebook 與 BIOS 基本架構','Available'],['🚀','UEFI 開機流程與為什麼需要初始化','Common Technical Knowledge','Boot Flow：Power On → OS','Available'],['🗺️','BIOS/UEFI Knowledge Map','Common Technical Knowledge','Learning Map / Curriculum Overview','Available'],['🔗','BIOS/UEFI 整體體制：從硬體到作業系統','Common Technical Knowledge','BIOS / UEFI Fundamentals','Available'],['🧪','IBV Workflow：CRB/RVP vs Project Board','Insyde Know-how','CRB Validation / RD ↔ PM','Internal']];
function nav(x){document.querySelectorAll('aside button').forEach(b=>b.classList.remove('on'));document.getElementById('n-'+x)?.classList.add('on')}function card(m,i){return `<div class="card mod" onclick="openM('${m[0]}')"><div>${i?'<span class="pill internal">Internal</span>':''}<span class="pill ${m[3]=='In Progress'?'progress':''}">${m[3]}</span></div><h3 style="margin-top:12px">${m[1]}</h3><p class="muted">${m[2]}</p><span style="font-size:12px;color:var(--p);font-weight:800">Open module →</span></div>`}
function home(){nav('home');app.innerHTML=`<section class="hero"><div class="card"><div class="eyebrow">BIOS PM Competency Development System</div><h1>從 BIOS 知識，到能獨立工作的 PM。</h1><p class="muted">Management Review 版本：先呈現 BIOS PM 新人培訓的整體架構、既有圖解資產與 PM Competency 方向；各 Module 內容後續依 Notion Project Tracker 逐項完成。</p><button class="btn" onclick="map()">查看 PM Learning Map</button></div><div class="card"><h2>Current Build Status</h2><div class="metrics"><div class="metric"><b>4</b><span>Learning Layers</span></div><div class="metric"><b>24+</b><span>Planned Modules</span></div><div class="metric"><b>5</b><span>Existing Diagrams</span></div><div class="metric"><b>L1–L4</b><span>Competency Levels</span></div></div><p class="muted">Review focus：Learning Map、四大 Layer、PM Collaboration、Insyde Know-how 差異化方向。</p></div></section><section class="section"><div class="eyebrow">Learning Architecture</div><h2>四大學習層</h2><div class="layers">${Object.entries(L).map(([k,v])=>`<div class="card layer" onclick="layer('${k}')"><div class="num">${v.n}</div><h2>${v.t}</h2><p class="muted">${v.s}</p><span class="pill">${v.m.length} modules</span>${v.i?'<span class="pill internal">Internal</span>':''}</div>`).join('')}</div></section><div class="note"><b>Roadmap：</b>先由此架構供 Management Review；後續教材、Case Study、Exam 與 Insyde Know-how 依 Notion Tracker 逐項完成。Internal / Confidential 內容不直接放入公開 GitHub Pages。</div>`}
function map(){nav('map');app.innerHTML=`<div class="eyebrow">PM Learning Map</div><h1 style="font-size:38px">新人從「知道」到「能獨立做」</h1><div class="card"><div class="flow"><div class="node">01 Common Technical Knowledge</div><span class="arrow">→</span><div class="node">02 Insyde Know-how</div><span class="arrow">→</span><div class="node">03 PM Professional Competency</div><span class="arrow">→</span><div class="node">04 PM Daily Practice</div></div><p class="muted">先懂產業共通知識，再學 Insyde 的方法與工具；接著建立 PM Collaboration 能力，最後落到每天能獨立執行的工作。</p></div><div class="levels section"><div class="card"><h3>L1 Awareness</h3><p class="muted">知道名詞、角色與目的。</p></div><div class="card"><h3>L2 Understanding</h3><p class="muted">能說明 Why / How 與責任邊界。</p></div><div class="card"><h3>L3 Application</h3><p class="muted">能套用到 Project / Issue / Customer 情境。</p></div><div class="card"><h3>L4 Independent PM</h3><p class="muted">能獨立判斷、協調、追蹤與對外溝通。</p></div></div>`}
function layer(k){nav(k);let v=L[k];app.innerHTML=`<div class="eyebrow">Layer ${v.n}</div><h1 style="font-size:38px">${v.t}</h1><p class="muted">${v.s}</p>${v.i?'<div class="note"><b>Internal Layer：</b>公開 Preview 只展示課程架構與 generic 概念；實際 Insyde Know-how 後續需配合 Internal Git / access control。</div>':''}<div class="mods section">${v.m.map(m=>card(m,v.i)).join('')}</div>`}
function openM(id){let x=lesson[id];if(!x){app.innerHTML=`<div class="card"><div class="eyebrow">Planned Module</div><h1 style="font-size:36px">內容將依 Notion Tracker 建立</h1><p class="muted">後續逐項補上 Learning Objective、圖解、新人版說明、PM Scenario、Knowledge Check 與 Practical Assessment。</p></div>`;return}app.innerHTML=`<div class="lesson"><div class="card"><div class="eyebrow">Training Module</div><h1 style="font-size:36px">${x.t}</h1><p class="muted"><b>Learning Objective：</b>${x.o}</p><div class="callout"><b>一句話：</b>${x.one}</div><h3>工作流程</h3><div class="flow">${x.f.map((n,i)=>`<div class="node">${n}</div>${i<x.f.length-1?'<span class="arrow">→</span>':''}`).join('')}</div><h3 style="margin-top:18px">新人要會的重點</h3><ul>${x.b.map(z=>`<li style="margin:8px 0;line-height:1.65">${z}</li>`).join('')}</ul></div><div class="card quiz"><div class="eyebrow">Knowledge Check</div><h2>${x.q[0]}</h2>${x.q[1].map((z,i)=>`<button onclick="answer(this,${i},${x.q[2]})">${z}</button>`).join('')}<p id="r" class="muted"></p></div></div>`}
function answer(b,i,a){document.querySelectorAll('.quiz button').forEach(x=>x.classList.remove('ok','no'));b.classList.add(i===a?'ok':'no');r.textContent=i===a?'正確。':'再想一下：回到流程與責任邊界。'}
function assetPage(){nav('assets');app.innerHTML=`<div class="eyebrow">Diagram Library</div><h1 style="font-size:38px">既有圖解資產</h1><p class="muted">先前生成的圖可直接沿用，並作為後續網站圖解的標準視覺語言。</p><div class="assets section">${assets.map(a=>`<div class="card asset"><div class="assetIcon">${a[0]}</div><span class="pill ${a[4]=='Internal'?'internal':''}">${a[4]}</span><h3 style="margin-top:12px">${a[1]}</h3><p class="muted"><b>Layer：</b>${a[2]}<br><b>Use：</b>${a[3]}</p></div>`).join('')}</div><div class="note"><b>Visual Standard：</b>後續沿用目前乾淨白底、2–3 主色、清楚流程箭頭、責任邊界與板子標註的教學圖風格。正式圖檔會隨各 Notion Module 完成逐步整合。</div>`}
function assessment(){nav('assess');app.innerHTML=`<div class="eyebrow">Competency Assessment</div><h1 style="font-size:38px">從 Knowledge 到 Independent PM</h1><div class="levels"><div class="card"><h3>Knowledge Check</h3><p class="muted">名詞、流程、基本概念。</p></div><div class="card"><h3>Scenario Question</h3><p class="muted">真實 PM 情境判斷。</p></div><div class="card"><h3>Case Analysis</h3><p class="muted">Evidence、baseline、scope、owner。</p></div><div class="card"><h3>Practical Output</h3><p class="muted">Customer Update、ITS Summary、Debug Matrix、Schedule。</p></div></div>`}home();
</script></body></html>
